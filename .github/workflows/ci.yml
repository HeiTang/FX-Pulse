name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - "api/**"
      - "web/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main, develop]
    paths:
      - "api/**"
      - "web/**"
      - ".github/workflows/**"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: poetry-${{ runner.os }}-${{ hashFiles('api/poetry.lock') }}

      - name: Install dependencies
        run: poetry install

      - name: Ruff lint
        run: poetry run ruff check src/ tests/ scripts/

      - name: Ruff format check
        run: poetry run ruff format --check src/ tests/ scripts/

      - name: Run tests
        run: poetry run pytest -v

      - name: Notify Discord on CI failure
        if: failure()
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_CI_CD }}
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          sha = os.environ['COMMIT_SHA']
          repo = os.environ['REPOSITORY']
          description = (
              f"Branch: {os.environ['BRANCH_NAME']}\n"
              f"Commit: https://github.com/{repo}/commit/{sha}\n"
              f"Run: https://github.com/{repo}/actions/runs/{os.environ['RUN_ID']}"
          )
          payload = {'allowed_mentions': {'parse': []}, 'embeds': [{
              'title': '❌ FX Pulse CI 失敗', 'description': description, 'color': 15548997
          }]}
          request = urllib.request.Request(
              os.environ['DISCORD_WEBHOOK'], data=json.dumps(payload).encode(),
              headers={'Content-Type': 'application/json'}, method='POST'
          )
          with urllib.request.urlopen(request, timeout=10):
              pass
          PY

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload browser test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
