name: Daily FX Scrape

on:
  schedule:
    # UTC 03:17 = Taiwan 11:17: daily rates (avoid the top-of-hour queue).
    - cron: "17 3 * * *"
    # UTC 09:47 = Taiwan 17:47: only missing currencies from the last 7 days.
    # Keep recovery separate so a blocked source is not retried seconds later.
    - cron: "47 9 * * *"
    # UTC 15:47 = Taiwan 23:47: a second missing-only recovery opportunity.
    - cron: "47 15 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Daily fetch or missing-only recovery"
        type: choice
        options: [daily, backfill]
        default: backfill

concurrency:
  group: fx-rates-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch-rates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4
        with:
          # Resolve the current branch after acquiring the writer lock, so queued
          # runs see cooldowns committed by the preceding run.
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: poetry-${{ runner.os }}-${{ hashFiles('api/poetry.lock') }}

      - name: Install dependencies
        run: poetry install --only main

      - name: Fetch rates
        if: github.event.schedule == '17 3 * * *' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'daily')
        run: poetry run fetch-rates --result-file scrape_result.json

      - name: Backfill missing rates (last 7 days)
        if: github.event.schedule == '47 9 * * *' || github.event.schedule == '47 15 * * *' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'backfill')
        run: poetry run backfill-rates --days 7 --result-file scrape_result.json

      - name: Preserve scrape report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-result
          path: |
            api/scrape_result.json
            api/scrape_state.json
          retention-days: 14

      - name: Check scrape status
        id: check-status
        if: always()
        run: |
          python - <<'PY' >> $GITHUB_OUTPUT
          import json, os
          path = 'scrape_result.json'
          try:
              if not os.path.exists(path):
                  print('has_failure=true')
              else:
                  r = json.load(open(path))
                  has_failure = r['status'] != 'ok'
                  print('has_failure=' + str(has_failure).lower())
          except Exception:
              print('has_failure=true')
          PY

      - name: Notify Discord — daily rates
        if: always() && (github.event.schedule == '17 3 * * *' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'daily'))
        run: |
          poetry run python scripts/notify_discord.py \
            --mode daily \
            --webhook "${{ secrets.DISCORD_WEBHOOK_FX_DAILY }}" \
            --result-file scrape_result.json
        continue-on-error: true

      - name: Notify Discord — alert on failure
        if: steps.check-status.outputs.has_failure == 'true'
        run: |
          if [ ! -f scrape_result.json ]; then
            python - <<'PY'
            import json
            from datetime import date
            msg = 'process crashed before writing result file'
            payload = {
                'date': date.today().isoformat(),
                'status': 'error',
                'results': {
                    'VISA':       {'status': 'error', 'currencies': 0, 'error': msg},
                    'Mastercard': {'status': 'error', 'currencies': 0, 'error': msg},
                    'JCB':        {'status': 'error', 'currencies': 0, 'error': msg},
                },
            }
            open('scrape_result.json', 'w').write(json.dumps(payload))
          PY
          fi
          poetry run python scripts/notify_discord.py \
            --mode alert \
            --webhook "${{ secrets.DISCORD_WEBHOOK_FX_ALERTS }}" \
            --result-file scrape_result.json \
            --role-id "${{ secrets.DISCORD_ROLE_ID_ALERT }}"
        continue-on-error: true

      - name: Commit rates and persistent source cooldowns
        if: always()
        run: |
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/src/data/rates.json api/scrape_state.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "data: update rates and scraper cooldowns"
          git push
